# Static Vite build (ported from PR #1). Values for VITE_* variables are set in the
# Netlify UI; never put secrets in them, because Vite inlines them into the page.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+.
  NODE_VERSION = "22"

# Single-page app: every path serves index.html (same rule as public/_redirects).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
